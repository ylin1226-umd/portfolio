<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yi-Chen Lin — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#181300;--panel:#262000;--ink:#f1ecd8;--muted:#b9b08a;--gold:#d4af37;--line:#4a4000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f0e2;--panel:#e9e3cd;--ink:#1d1800;--muted:#5d5530;--gold:#8a6d00;--line:#cfc59a}}
:root[data-theme="light"]{--bg:#f4f0e2;--panel:#e9e3cd;--ink:#1d1800;--muted:#5d5530;--gold:#8a6d00;--line:#cfc59a}
:root[data-theme="dark"]{--bg:#181300;--panel:#262000;--ink:#f1ecd8;--muted:#b9b08a;--gold:#d4af37;--line:#4a4000}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Libre Baskerville",Georgia,serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.15}
a{color:var(--gold)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;padding:.9rem 1rem}
nav a{text-decoration:none;color:var(--ink)}nav a:hover,nav a.on{color:var(--gold);text-decoration:underline}
section{max-width:960px;margin:0 auto;padding:4.5rem 1.5rem}
.hero{text-align:center;padding-top:5rem}
.hero h1{font-size:clamp(2.6rem,9vw,5.5rem);color:var(--gold);letter-spacing:.02em}
.hero p{color:var(--muted);letter-spacing:.3em}
.ph{background:radial-gradient(circle at 30% 35%,var(--gold) 0 6%,transparent 7%),radial-gradient(circle at 70% 25%,var(--ink) 0 5%,transparent 6%),var(--panel);border:1px solid var(--line);aspect-ratio:3/2;display:flex;align-items:flex-end;padding:.6rem;font-size:.8rem;color:var(--muted)}
img{max-width:100%;display:block}
.hero .ph{margin-top:2.5rem}
h2{font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:.4rem}
.meta{color:var(--muted);font-style:italic;margin:0 0 1.5rem}
.block{border-left:3px solid var(--gold);padding:.2rem 0 .2rem 1.2rem;margin:1.6rem 0}
.block h3{font-size:1.2rem;margin-bottom:.3rem}
.block ul{margin:.3rem 0;padding-left:1.2rem}
.btn{display:inline-block;margin:.4rem .8rem .4rem 0;padding:.5rem 1.1rem;border:1px solid var(--gold);text-decoration:none;border-radius:6px}
.btn:hover{background:var(--gold);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-top:1rem}
.grid .ph{aspect-ratio:3/4}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.1rem .8rem;margin:.2rem .3rem .2rem 0;font-size:.85rem;color:var(--muted)}
footer{text-align:center;padding:3rem 1rem;color:var(--muted)}
footer b{font:italic 700 2.4rem "Playfair Display",serif;color:var(--gold);display:block}
section+section{border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<footer id="foot"></footer>
<script>
/* =====================================================================
   EDIT HERE. Everything on the site is generated from this object.
   - Add a project: copy one entry in `projects` and change the text.
   - Add a photo: add { src: "https://…jpg" , alt: "…" } to a gallery's `photos`.
     (Leave src empty "" to show a placeholder.)
   - Add a section to a project: add { title, text } or { title, list: [...] } to `blocks`.
   - Links: put your Figma URLs in `links`.
   ===================================================================== */
const SITE = {
  name: "Yi-Chen Lin",
  tagline: "Portfolio",
  cover: "", // URL of your cover photo (the crocus)
  about: {
    heading: "About me",
    paragraphs: [
      "I am an undergraduate with a background in English Literature at National Central University, Taiwan, with additional experience in theatre.",
      "I'm fascinated by the different stories people carry with them: how their experiences shape the way they speak, act, and connect with others. In a way, I like observing people as if they were living novels. In teams, I've been described as a fast learner, and I'm the type of leader who makes sure everyone is taken into account when making decisions.",
      "I recently got into photography as a new hobby for recording what I see on trips with friends and family. I also enjoy video games and a very messy, mixed playlist: metal, R&B and Japanese City Pop."
    ],
    nickname: "Yi-Chen Lin (or Colette)"
  },
  projects: [
    {
      id: "little-reborne", nav: "Little Reborne",
      title: "Little Reborne & Co.", subtitle: "Secondhand children's clothes resale app",
      dates: "08/06/2024 – 08/28/2024",
      summary: "A mid-fidelity mobile app prototype that helps parents resell and discover gently used children's clothes, focused on sustainability, convenience and community.",
      links: [{ label: "Try the prototype", url: "#" }],
      blocks: [
        { title: "Problem", text: "Children outgrow clothes physically (about 6 to 12 months) and mentally at a fast pace, and parents invest a lot of time and money buying new ones." },
        { title: "Goal", text: "Design a mid-fidelity mobile prototype within 3 weeks that lets parents easily browse, filter, and post children's clothes for resale." },
        { title: "Research: the users", list: [
          "25% of respondents keep outgrown clothes uselessly in the closet; 19% admitted throwing them away.",
          "79% of parents would lend out outgrown clothes if they could earn extra income and the process was convenient.",
          "73% would share revenue if someone managed the whole process for them.",
          "Source: The Rewear Company (2021), consumer research on reusing kidswear."] },
        { title: "Research: competitive audit", text: "Comparing Facebook Marketplace, Shein and Kidizen showed that a platform combining selling, buying, donating and lending for kids' clothes hasn't been explored." },
        { title: "Research: personas", text: "Ashley (35, teacher, short on time) and Diane (40, stay-at-home mom, not very tech-savvy, wants a sustainable clothing cycle)." },
        { title: "Design: paper wireframes → low fidelity → mid fidelity", text: "Sketches focused on a step-by-step item posting flow and a pickup arrangement page. The mid-fidelity version added card components, filter tags (size, condition, season), search, consistent colors, and undo/error prevention." },
        { title: "Lessons learned", text: "My first UX case study had a steep learning curve with Figma, but it was rewarding to see my ideas take shape on screen." },
        { title: "What's next", list: ["Test the prototype with real parents.", "Add lending, donation services, and a saving function in item upload."] }
      ]
    },
    {
      id: "discover-tohoku", nav: "Discover Tohoku",
      title: "Discover Tohoku", subtitle: "Tourism app for less visited places",
      dates: "09/11/2025 – 09/22/2025",
      summary: "A mid-fidelity app concept that helps foreign tourists discover lesser-known attractions in Japan's Tōhoku region, based on a group trip to Oshu City with the TUJP language exchange program.",
      links: [{ label: "Try the prototype", url: "#" }],
      blocks: [
        { title: "Problem", text: "Low tourist engagement due to fragmented information, inconsistent translations, and unclear navigation guidance." },
        { title: "Goal", text: "Within 2 weeks, prototype an app supporting 3–5 key tasks (discovering attractions, filtering preferences, travel bundles later on) based on pain points from tourist interviews." },
        { title: "Research: trip & interviews", list: [
          "Pros: quiet town, abundant sights and history, a famous local star helps marketing.",
          "Cons: few Halal food options, little multilingual signage, low publicity.",
          "Pain points: language barrier, scattered commuting info, fear of wasting time, uncertainty about small towns."] },
        { title: "Research: competitive audit & personas", text: "Aimed for a mix of Spotted by Locals and Atlas Obscura for Tohoku. Personas: Emma (25, US visitor) and Hiroshi (34, local English teacher)." },
        { title: "Design", text: "Used the crazy 8 method for wireframes to avoid over-perfecting. The prototype uses a minimalist layout with tags and etiquette notes so users aren't overwhelmed." },
        { title: "Lessons learned", text: "A map-heavy app was too ambitious, so I pivoted to a content-focused app. First-hand group data grounded my decisions in real user needs." },
        { title: "What's next", list: ["Usability testing with tourists.", "Travel bundles and AI translation.", "Partner with local tourism boards to verify content."] }
      ]
    },
    {
      id: "theatre", nav: "Theatre",
      title: "All About Theatre", subtitle: "Onstage and backstage",
      dates: "2023 – 2025",
      summary: "My experiences in theatre as an actress and as a member of the costume department, which sharpened my problem solving and teamwork.",
      links: [],
      blocks: [
        { title: "Holy Crab! (actress, 11/2023 – 05/2024)", text: "Played Libby, a Times Square street performer whose real identity is the Statue of Liberty. I built the character through goals and \"beats\", which felt like iteration in design. In rehearsal I worked on genuine facial expression by practicing in the mirror and staying in the moment, and by show day I'd overcome my stage fright." },
        { title: "Filial Cannibalism (makeup & costume design, 11/2024 – 05/2025)", text: "For this Taiwanese countryside play set in the 2010s, our team revised early too-modern costume ideas into a picture board that fit the script. I aged an actress from 20 to 50 as Mrs. Chen in under two hours, and helped actors change clothes in under 20 seconds during the show." },
        { title: "Lessons learned", text: "I learned two ways to build a character: embodying their soul as an actress, or building their silhouette with costumes. That visual storytelling and human psychology became the foundation of my design approach: thinking in the user's shoes." }
      ],
      gallery: [{ src: "", alt: "Holy Crab! poster" }, { src: "", alt: "Filial Cannibalism poster" }]
    }
  ],
  photography: {
    nav: "Photography", heading: "Photography",
    text: "Besides these photos, I can offer my photography skills to support the community during events, such as documenting student–faculty interactions.",
    galleries: [
      { title: "Water", photos: [{ src: "", alt: "Raindrops" }, { src: "", alt: "Ocean waves" }, { src: "", alt: "Jellyfish" }] },
      { title: "Shades of blues", photos: [{ src: "", alt: "Aquarium" }, { src: "", alt: "Bay view" }, { src: "", alt: "Heart frame" }] },
      { title: "Light", photos: [{ src: "", alt: "Torii gates" }, { src: "", alt: "Deer" }, { src: "", alt: "Lanterns" }] },
      { title: "Trip to NYC", photos: [{ src: "", alt: "Street" }, { src: "", alt: "Times Square" }, { src: "", alt: "Statue of Liberty" }] },
      { title: "Poles", photos: [{ src: "", alt: "Bird on pole" }, { src: "", alt: "Moon and tower" }, { src: "", alt: "Ring lamp" }] }
    ]
  },
  ending: "Thank you for taking the time to explore my portfolio. Every project here reflects a piece of me. I hope it resonated with you in some way."
};

/* ---------- renderer (no need to edit below) ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pic = p => p.src ? `<img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy">` : `<div class="ph" role="img" aria-label="${esc(p.alt)}">${esc(p.alt)}</div>`;
const block = b => `<div class="block"><h3>${esc(b.title)}</h3>${b.text ? `<p>${esc(b.text)}</p>` : ""}${b.list ? `<ul>${b.list.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div>`;
const gallery = g => `<h3 style="margin-top:2rem">${esc(g.title)}</h3><div class="grid">${g.photos.map(pic).join("")}</div>`;

const navItems = [["about", "About me"], ...SITE.projects.map(p => [p.id, p.nav]), ["photography", SITE.photography.nav]];
document.getElementById("nav").innerHTML = `<a href="#top">Home</a>` + navItems.map(([id, t]) => `<a href="#${esc(id)}">${esc(t)}</a>`).join("");

document.getElementById("app").innerHTML = `
<section id="top" class="hero"><h1>${esc(SITE.name)}</h1><p>${esc(SITE.tagline.toUpperCase())}</p>
  ${pic({ src: SITE.cover, alt: "Cover photo" })}</section>
<section id="about"><h2>${esc(SITE.about.heading)}</h2><p class="meta">${esc(SITE.about.nickname)}</p>
  ${SITE.about.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}</section>
${SITE.projects.map(p => `<section id="${esc(p.id)}"><h2>${esc(p.title)}</h2>
  <p class="meta">${esc(p.subtitle)}, ${esc(p.dates)}</p><p>${esc(p.summary)}</p>
  ${(p.links || []).map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}
  ${p.blocks.map(block).join("")}
  ${p.gallery ? `<div class="grid">${p.gallery.map(pic).join("")}</div>` : ""}</section>`).join("")}
<section id="photography"><h2>${esc(SITE.photography.heading)}</h2><p>${esc(SITE.photography.text)}</p>
  ${SITE.photography.galleries.map(gallery).join("")}</section>`;
document.getElementById("foot").innerHTML = `<p style="max-width:560px;margin:0 auto 1rem">${esc(SITE.ending)}</p><b>Fin.</b>`;

/* highlight current section in nav */
const links = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("section").forEach(s => io.observe(s));
</script>
</body>
</html>
